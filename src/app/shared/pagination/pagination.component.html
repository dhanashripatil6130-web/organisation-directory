<nav class="pager" [attr.aria-label]="'pager.label' | t">
  <div class="pager__summary">
    <p class="pager__range" aria-live="polite">
      {{ 'pager.range' | t: { from: from(), to: to(), total: total() } }}
    </p>
    <label class="pager__size">
      {{ 'pager.size' | t }}
      <select #size class="pager__select" (change)="pageSizeChange.emit(+size.value)">
        @for (option of sizeOptions; track option) {
          <option [value]="option" [selected]="option === pageSize()">{{ option }}</option>
        }
      </select>
    </label>
  </div>

  <div class="pager__pages">
    <button type="button" class="pager__nav" [disabled]="page() <= 1" (click)="pageChange.emit(page() - 1)">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6" /></svg>
      <span class="pager__label">{{ 'pager.previous' | t }}</span>
    </button>

    @for (item of pages(); track $index) {
      @if (item === null) {
        <span class="pager__gap" aria-hidden="true">{{ 'pager.gap' | t }}</span>
      } @else {
        <button
          type="button"
          class="pager__page"
          [class.pager__page--current]="item === page()"
          [attr.aria-current]="item === page() ? 'page' : null"
          [attr.aria-label]="'pager.goTo' | t: { page: item }"
          (click)="pageChange.emit(item)"
        >
          {{ item }}
        </button>
      }
    }

    <button type="button" class="pager__nav" [disabled]="page() >= pageCount()" (click)="pageChange.emit(page() + 1)">
      <span class="pager__label">{{ 'pager.next' | t }}</span>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6" /></svg>
    </button>
  </div>
</nav>
